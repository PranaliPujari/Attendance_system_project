<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Segoe UI', sans-serif;
    }
    .card:hover {
      transform: scale(1.02);
      transition: 0.2s ease;
    }
    .container {
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">Attendance System</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/add_student_form">Add Student</a>
      <a class="nav-link" href="/qrcodes">QR Codes</a>
      <a class="nav-link" href="/attendance_report">Report</a>
    </div>
  </nav>

  <div class="container">
    <div class="row text-center">
      <div class="col-md-3 mb-4">
        <div class="card shadow p-3">
          <h5 class="card-title">📷 QR Scanner</h5>
          <p class="card-text">Scan student ID to record attendance</p>
          <a href="/webcam_test" class="btn btn-primary">Start Scanning</a>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card shadow p-3">
          <h5 class="card-title">➕ Add Student</h5>
          <p class="card-text">Add new student to the system</p>
          <a href="/add_student_form" class="btn btn-success">Add Now</a>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card shadow p-3">
          <h5 class="card-title">🧾 QR Codes</h5>
          <p class="card-text">View and download student QR codes</p>
          <a href="/qrcodes" class="btn btn-warning text-white">View Codes</a>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card shadow p-3">
          <h5 class="card-title">📊 Attendance Report</h5>
          <p class="card-text">Filter, view and export attendance</p>
          <a href="/attendance_report" class="btn btn-info text-white">View Report</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
