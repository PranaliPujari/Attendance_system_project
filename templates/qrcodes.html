<!DOCTYPE html>
<html>
<head>
  <title>Student QR Codes</title>
</head>
<body>
  <h2>📄 All Student QR Codes</h2>
  {% for qr in qr_files %}
    <div style="margin-bottom: 15px;">
      <img src="{{ url_for('static', filename='qr_codes/' + qr) }}" width="150">
      <p>{{ qr.replace('.png', '') }}</p>
    </div>
  {% endfor %}
</body>
</html>
